<!-- internal css -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: cornflowerblue;
    
        }

        h1
        {
            text-decoration: underline;
            color: rgb(177, 95, 95);
            text-align: center;

        }
        p
        {
            font-family: Times;
        }
    </style>
 </head>
 <body>
    <h1>Introduction to the INTERNAL CSS</h1>
    <p>Inline CSS is written directly inside an HTML tag using the style attribute. It is used to style a single element.</p>
 </body>
 </html>
