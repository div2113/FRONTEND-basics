<!-- dipslay-inline -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul
        {
            border: 1px solid black;
        }

        li
        {
            border: 1px solid brown;
            display: inline;
        }
    </style>
</head>
<body>
    <ul>
        <li>Mango</li>
        <li>Cherry</li>
        <li>Orange</li>
    </ul>
</body>
</html>
