<!-- display-flex -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-container
        {
            border: 2px solid black;
            background-color: bisque;
            display: flex;
            justify-content: center;
        }

        .d
        {
            border: 1px solid black;
            height: 75px;
            width: 100px;
        }
        
        .d1
        {
            background-color: blueviolet;
            
        }

        .d2
        {
            background-color: rgb(160, 80, 235);
        }

        .d3
        {
            background-color: rgb(174, 119, 224);
        }

        .d4
        {
            background-color: rgb(213, 178, 247);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="d d1"></div>
        <div class="d d2"></div>
        <div class="d d3"></div>
        <div class="d d4"></div>
    </div>
</body>
</html>
