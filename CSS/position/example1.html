<!-- position-relative -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box-1
        {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            position: relative;
            left: 100px;
        }

        .box-2
        {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            position: relative;
            left: -100px;
        }

        .box-3
        {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            position:relative;
            right: 100px;
        }

        .box-4
        {
            height: 100px;
            width: 100px;
            background-color: blueviolet;
            position: relative;
            right: -100px;
        }

        
    </style>
</head>
<body style="margin-left: 10%; border-left: 2px solid black;">
    <p><b>Position relative left positive</b></p>
    <div class="box-1"></div>

    <p><b>Position relative left negative</b></p>
    <div class="box-2"></div>

    <p><b>Position relative right positive</b></p>
    <div class="box-3"></div>

    <p><b>Position relative right negative</b></p>
    <div class="box-4"></div>
</body>
</html>
