<!-- class selector  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Ex1
        {
            color: palevioletred;
            font-style: oblique;
            text-align: center;
        }

        p.small
        {
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1 class="Ex1">Heading 1</h1><br>
    <p class="Ex1">Paragraph 1</p>
    <p class="Ex1">Paragraph 2</p>
    <p class="Ex1 small">Paragraph 3</p>
</body>
</html>
