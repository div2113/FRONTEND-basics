<!-- Text properties
text-align
text-decoration
text-shadow -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h3
        {
            text-align:center;
            text-decoration:underline ;
            text-decoration-style: wavy;
            text-decoration-color: red;
            text-decoration-thickness:1px;
            text-transform:uppercase;
            text-shadow: 2px 2px 5px rgb(143, 14, 143);
            
        }

        p
        {
            font-weight: lighter;
        }

        
    </style>
</head>
<body>
    <h3>Hello world!!</h3>
    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Repellendus iste atque laborum ducimus ullam eligendi possimus distinctio, pariatur perspiciatis aspernatur libero accusantium odio enim doloremque odit illum animi. Qui, sequi?</p>
</body>
</html>
