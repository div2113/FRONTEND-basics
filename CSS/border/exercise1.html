<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        #p1
        {
            font-size: large;
            color: aqua;
            border: 3px solid black;
            background-color: grey;
        }

        #p2
        {
            font-size: large;
            color: rgb(7, 7, 250);
            border: 3px dashed black;
            background-color: rgb(168, 51, 51);
        }
        
        #p3
        { 
            font-size: large;
            color: rgb(235, 7, 7);
            border: 3px black dotted;
            background-color: #19e0e0;
        }

    </style>
</head>
<body>
    <p id="p1"><b>Change Color using color name</b></p>
    <p id="p2"><b>change color using RGB code</b></p>
    <p id="p3"><b>change color using Hexa code</b></p>
</body>
</html>
