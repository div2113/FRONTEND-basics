<!-- Introduction to the basic tags of html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- for alignment of text we useing center -->
    <center><h1>Quastech</h1></center>  
    <hr size="10" color="red">
    <h2>Hello</h2>
    <h3>Hello</h3>
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>
    <p>hey how are youuu?</p>
    <b>Hello world</b><br>
    <strong>Hello world</strong><br>
    <small>Hello world</small><br>
    <em>Hello world</em><br>
    <i>Hello world</i><br>
    <u>Hello world</u><br>
    <br>
    <s>Hello world</s><br>
    <strike>Hello world</strike>
    <br>
    <!-- for sqaure -->
    2 <sup>2</sup><br>

    <!-- for down values -->
    <b>H <sub>2</sub>O</b>

    <!-- lines -->
    <hr>
    <br>
    <img src="cat.jpg" width="500px" height="300px" alt="animal">

</body>
</html>
