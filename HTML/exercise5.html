<!-- table + form creation -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <table border="1" cellpadding="10" cellspacing="0">
        <tr>
            <th colspan="2">Student Registration Form</th>
        </tr>

        <tr>
            <th>Name:</th>
            <td ><input type="text" name="name"></td>
        </tr>

        <tr>
            <th>Email:</th>
            <td ><input type="email" name="email"></td>
        </tr>

        <tr>
            <th>Password:</th>
            <td ><input type="password" name="pass"></td>
        </tr>
        
        <tr>
            <th>Gender:</th>
            <td><input type="radio" name="gender">Female <br>
                <input type="radio" name="gender">Male
            </td>
        </tr>

        <tr>
            <th>Hobbies:</th>
            <td><input type="checkbox" name="cb">Reading <br>
                <input type="checkbox" name="cb">Music <br>
                <input type="checkbox" name="cb">Sports
            </td>
        </tr>

        <tr>
            <th>Course</th>
            <td>
                <select name="course" id="">
                    <option>Select Course</option>
                    <option>BCA</option>
                    <option>BSC IT</option>
                    <option>MCA</option>
                </select>

            </td>
        </tr>
        
        <tr>
            <th >Address:</th>
            <td>
                <textarea rows="4" cols="25"></textarea>
            </td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" value="Submit" > <input type="reset" value="Reset"></td>
        </tr>
    </table>
 </body>
 </html>
