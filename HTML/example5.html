<!-- Form creation -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
</head>
<body>
    <fieldset>
        <legend align="center">Employee Registration Form</legend>
        <form action="">
            <table class="table table-success">
                <tr>
                    <td>Name:</td>
                    <td><input type="text" name="username" placeholder="Enter username" class="form-control"></td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" placeholder="Enter password" class="form-control"></td>
                </tr>

                <tr>
                    <td>Age:</td>
                    <td><input type="number" name="age" placeholder="Enter your age" min="18" max="100" class="form-control"></td>
                </tr>

                <tr>
                    <td>Phone no:</td>
                    <td><input type="tel" name="phone no" placeholder="Enter your phone number" pattern="[0-9]{10}" class="form-control"></td>
                </tr>

                <tr>
                    <td>Website:</td>
                    <td><input type="url" name="website" placeholder="http://" class="form-control"></td>
                </tr>

                <tr>
                    <td>DOB:</td>
                    <td><input type="date" name="dob" placeholder="Enter your date of birth" class="form-control"></td>
                </tr>

                <tr>
                    <td>Time:</td>
                    <td><input type="time" name="meeting" class="form-control"></td>
                </tr>

                <tr>
                    <td>DateTime</td>
                    <td><input type="datetime-local" name="datetime" class="form-control"></td>
                </tr>

                <tr>
                    <td>Month:</td>
                    <td><input type="month" name="month" class="form-control"></td>
                </tr>

                <tr>
                    <td>Week</td>
                    <td><input type="week" name="week" class="form-control"></td>
                </tr>

                <tr>
                    <td>Range:</td>
                    <td><input type="range" name="range" min="0" max="50" class="form-control"></td>
                </tr>

                <tr>
                    <td>Colour</td>
                    <td><input type="color" name="colour" class="form-control"></td>
                </tr>

                <tr>
                    <td>File:</td>
                    <td><input type="file" name="fname" accept="image/" class="form-control"></td>
                </tr>

                <tr>
                    <td rowspan="2">Gender:</td>
                    <td><input type="radio" name="g1">Female</td>
                </tr>
                <tr>
                    <td><input type="radio" name="g1">Male</td>
                </tr>

                <tr>
                    <td>Check box</td>
                    <td><input type="checkbox" name="checkbox" >Python  <input type="checkbox" name="checkbox" >HTML  <input type="checkbox" name="checkbox" >JAVA</td>

                </tr>
                <tr>
                    <td>
                        <button><input type="submit" value="AddInfo" class="btn btn-success"></button>
                        <button><input type="reset" value="ClearInfo" class="btn btn-danger"></button>
                        <button><input type="button" value="clickMe" class="btn btn-warning"></button>
                        <button>Click Me</button>
                    </td>
                </tr>
            </table>
        </form>
    </fieldset>
</body>
</html>
