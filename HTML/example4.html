<!-- Types of list -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="aqua">
    <marquee bgcolor="red">Order List</marquee>
    <ol type="i">
        <li>Tea</li>
        <li>Milk</li>
        <li>Coffee</li>
    </ol>

    <H1>Unorder List</H1>
    <ul type="circle">
        <li>Tea</li>
        <li>Milk</li>
        <li>Coffee</li>
    </ul>

    <h1>Description List</h1>
    <dl>
        <dt><strong>HTML</strong></dt>
        <dd>HTML is a hypertext markup language.</dd>
        <br>
        <dt><b>PYTHON</b></dt>
        <dd>Python is high-level , easy to learn programming language</dd>
    </dl>
</body>
</html>
